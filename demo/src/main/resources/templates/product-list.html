<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Shop Đồ Thể Thao</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Ảnh luôn cố định chiều cao, không bị méo */
        .product-card .card-img-top {
            height: 360px;
            object-fit: cover;
        }

        /* Card body dùng flex để đẩy nút xuống đáy */
        .product-card .card-body {
            display: flex;
            flex-direction: column;
        }

        /* Phần giá + nút luôn nằm ở đáy card */
        .product-card .card-footer-area {
            margin-top: auto;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">👟 Cửa Hàng Đồ Thể Thao ⚽</h1>
    <div class="text-center mb-4">
        <a href="/store/add" class="btn btn-success">➕ Thêm Sản Phẩm Mới</a>
    </div>

    <!-- row-cols-md-3 + g-4 giúp các card đều nhau và có khoảng cách đẹp -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="p : ${products}">
            <div class="card h-100 shadow-sm product-card">
                <img th:src="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)} ? ${p.imageUrl} : 'https://placehold.co/300x200?text=San+Pham'"
                     class="card-img-top" alt="Ảnh sản phẩm" referrerpolicy="no-referrer"
                     onerror="this.src='https://placehold.co/300x200?text=San+Pham'">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.name}">Tên sản phẩm</h5>
                    <p class="card-text text-muted" th:text="${p.description}">Mô tả sản phẩm</p>

                    <div class="card-footer-area">
                        <p class="h5 text-danger mb-3"
                           th:text="${p.price != null} ? ${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ' : 'Liên hệ'">
                            0 VNĐ
                        </p>
                        <button class="btn btn-primary w-100 mb-2">Thêm vào giỏ 🛒</button>
                        <div class="d-flex gap-2">
                            <a th:href="@{/store/edit/{id}(id=${p.id})}"
                               class="btn btn-warning text-white flex-grow-1">Sửa</a>
                            <a th:href="@{/store/delete/{id}(id=${p.id})}"
                               class="btn btn-danger flex-grow-1"
                               onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này không?')">Xóa</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
