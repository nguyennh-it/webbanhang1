<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header-css">
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .product-card .card-img-top { height: 360px; object-fit: cover; }
        .product-card .card-body { display: flex; flex-direction: column; }
        .product-card .card-footer-area { margin-top: auto; }
    </style>
</head>
<body>

<!-- Thanh Menu dùng chung -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/store/products">👟 SportShop</a>
        <div class="collapse navbar-collapse">
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/store/products">Cửa hàng</a>
                <a class="nav-link" href="/store/add">Thêm đồ mới</a>
            </div>
            <!-- Form tìm kiếm nằm luôn trên thanh Navbar cho xịn -->
            <form class="d-flex" th:action="@{/store/products}" method="get">
                <input class="form-control me-2" type="search" name="keyword"
                       placeholder="Tìm sản phẩm..." th:value="${keyword}">
                <button class="btn btn-outline-success" type="submit">Tìm</button>
            </form>
        </div>
    </div>
</nav>

<!-- Chân trang dùng chung -->
<footer th:fragment="footer" class="text-center mt-5 py-4 bg-light text-muted border-top">
    <div class="container">
        <p>© 2026 SportShop - Dự án Backend Java Spring Boot của bạn</p>
    </div>
</footer>

</body>
</html>
